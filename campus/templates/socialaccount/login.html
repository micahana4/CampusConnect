
{% extends "campus/base.html" %}

{% block title %}Continue with Google{% endblock %}

{% block content %}
<div class="page-head">
    <h1>Continue with Google</h1>
</div>

<div class="panel narrow">
    <p>
        You are about to sign in using your Google account.
    </p>

    <form method="post">
        {% csrf_token %}

        <button class="btn btn-primary" type="submit">
            Continue
        </button>
    </form>
</div>
{% endblock %}
